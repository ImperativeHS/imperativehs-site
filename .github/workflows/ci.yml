name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fail on known high/critical vulnerabilities in packages that ship to the site.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
